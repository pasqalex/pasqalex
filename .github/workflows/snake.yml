name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: pasqalex
          outputs: |
            github-contribution-grid-snake.svg?color_snake=#f72585&color_dots=#0f0c29,#302b63,#4cc9f0,#00f5d4,#f72585
      
      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: output
          force_orphan: true
