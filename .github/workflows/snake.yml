name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Каждый день в полночь UTC
  workflow_dispatch:  # Позволяет запускать вручную
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Шаг 1: Checkout репозиторий
      - name: Checkout repository
        uses: actions/checkout@v3

      # Шаг 2: Генерируем змейку
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Шаг 3: Создаём ветку output и пушим туда файлы
      - name: Create output branch and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Создаём ветку output
          git checkout --orphan output
          
          # Удаляем все файлы
          git rm -rf .
          
          # Копируем сгенерированные файлы
          cp -r dist/* .
          
          # Добавляем файлы
          git add .
          
          # Коммитим
          git commit -m "Generate snake animation"
          
          # Пушим в ветку output
          git push origin output --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
